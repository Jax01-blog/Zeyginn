<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAX MuSIc</title>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      min-height: 100vh;
      backdrop-filter: blur(4px);
    }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      margin: 15px 30px;
      position: sticky;
      top: 15px;
      z-index: 100;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
    }
    .auth-area button {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      margin-left: 10px;
    }
    .auth-area img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .layout {
      display: flex;
      margin: 20px 30px;
      gap: 20px;
    }
    .sidebar {
      width: 250px;
      flex-shrink: 0;
      height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 15px;
    }
    .sidebar a {
      display: block;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 5px;
    }
    .sidebar a:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .main-content {
      flex: 1;
      min-height: calc(100vh - 120px);
    }
    .player-bar {
      position: fixed;
      bottom: 20px;
      left: 30px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 100;
    }
    .player-bar audio {
      flex: 1;
    }
    .beat-card {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      padding: 15px;
    }
    .beat-card img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
    }
    .beat-info {
      flex: 1;
    }
    .beat-info h3 {
      margin-bottom: 5px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }
    .card {
      padding: 15px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .card img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .form-group input[type="file"] {
      padding: 5px;
    }
    .admin-layout {
      display: flex;
      gap: 20px;
    }
    .admin-sidebar {
      width: 200px;
      flex-shrink: 0;
    }
    .admin-sidebar a {
      display: block;
      padding: 8px 10px;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 3px;
    }
    .admin-sidebar a:hover, .admin-sidebar a.active {
      background: rgba(255,255,255,0.15);
    }
    .admin-content {
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    th {
      background: rgba(255,255,255,0.05);
    }
    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      background: rgba(255,255,255,0.1);
    }
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .filters input, .filters select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
        margin: 10px;
      }
      .sidebar {
        width: 100%;
        height: auto;
      }
      .navbar {
        flex-direction: column;
        align-items: flex-start;
        margin: 10px;
      }
      .nav-links {
        margin: 10px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .player-bar {
        left: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Simple loading indicator in case JS fails -->
  <div id="initial-loading" style="text-align:center; padding:40px; color:#fff;">Loading JAX MuSIc...</div>
  
  <!-- Navbar -->
  <div class="navbar glass" id="navbar" style="display:none;">
    <div class="logo">JAX MuSIc</div>
    <nav class="nav-links" id="nav-links"></nav>
    <div class="auth-area" id="auth-area"></div>
  </div>

  <!-- Layout -->
  <div class="layout" id="layout" style="display:none;">
    <aside class="sidebar glass" id="sidebar"></aside>
    <main class="main-content" id="main-content"></main>
  </div>

  <!-- Player Bar -->
  <div class="player-bar glass" id="player-bar" style="display:none;">
    <div id="player-info" style="min-width: 150px;">No track</div>
    <audio id="audio-player" controls></audio>
    <button class="btn" onclick="playNext()">⏭</button>
    <button class="btn" onclick="playPrev()">⏮</button>
  </div>

  <!-- Auth Modal -->
  <div class="modal" id="auth-modal">
    <div class="modal-content glass">
      <h2>Sign In</h2>
      <p>Use your Google account to continue</p>
      <button class="btn" onclick="signInWithGoogle()">Sign in with Google</button>
      <button class="btn" onclick="closeModal('auth-modal')">Cancel</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="upload-modal">
    <div class="modal-content glass" id="upload-modal-content"></div>
  </div>

  <script>
    // ================== CONFIG ==================
    const firebaseConfig = {
      apiKey: "AIzaSyCnJnpCDnq3krbQSeCbiryxSmsQr4oxRBA",
      authDomain: "jax-music.firebaseapp.com",
      projectId: "jax-music",
      storageBucket: "jax-music.firebasestorage.app",
      messagingSenderId: "555515262183",
      appId: "1:555515262183:web:24742e7b4e9412ddfd9e42",
      measurementId: "G-WLJSD28LDX"
    };

    try {
      // Initialize Firebase
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
      } else {
        throw new Error('Firebase SDK not loaded');
      }

      // Initialize Supabase
      if (typeof window.supabase !== 'undefined') {
        const supabaseUrl = 'https://pkxbypnawlvkqgkwfknh.supabase.co';
        const supabaseKey = 'sb_publishable_8c7uOfD0FiciFels2KmSHA_iqGlfvSd';
        window.supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
      } else {
        throw new Error('Supabase SDK not loaded');
      }
    } catch (error) {
      console.error('Initialization error:', error);
      document.getElementById('initial-loading').innerHTML = 
        '<div style="text-align:center; padding:40px; color:red;">Failed to load libraries. Check your internet connection.</div>';
      // Stop further execution
      throw error;
    }

    // Aliases
    const auth = firebase.auth();
    const db = firebase.firestore();
    const supabase = window.supabaseClient;

    // ================== STATE ==================
    let currentUser = null;
    let userData = null;
    let currentRoute = 'home';
    let currentBeatId = null;
    let currentArtistId = null;
    let adminSection = 'dashboard';
    let allBeats = [];
    let allMusic = [];
    let favorites = new Set();
    let playerQueue = [];
    let playerIndex = 0;

    const mainContent = document.getElementById('main-content');
    const sidebar = document.getElementById('sidebar');
    const navLinks = document.getElementById('nav-links');
    const authArea = document.getElementById('auth-area');
    const authModal = document.getElementById('auth-modal');
    const uploadModal = document.getElementById('upload-modal');
    const uploadModalContent = document.getElementById('upload-modal-content');
    const audioPlayer = document.getElementById('audio-player');
    const playerInfo = document.getElementById('player-info');

    // Hide loading indicator after a moment
    setTimeout(() => {
      document.getElementById('initial-loading').style.display = 'none';
      document.getElementById('navbar').style.display = 'flex';
      document.getElementById('layout').style.display = 'flex';
      document.getElementById('player-bar').style.display = 'flex';
    }, 500);

    // ================== UTILITY ==================
    function randomBg() {
      document.body.style.backgroundImage = `url(https://picsum.photos/1920/1080?random=${Math.random()})`;
    }
    randomBg();

    function truncate(str, n) {
      return str && str.length > n ? str.substring(0, n) + '...' : str;
    }

    function formatDate(ts) {
      if (!ts) return 'N/A';
      return new Date(ts).toLocaleDateString();
    }

    function navigate(route) {
      location.hash = route;
    }

    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // ================== AUTH ==================
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        await fetchUserData(user.uid);
      } else {
        currentUser = null;
        userData = null;
      }
      updateUI();
      handleRoute();
    });

    async function fetchUserData(uid) {
      try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
          userData = { uid, ...doc.data() };
        } else {
          userData = {
            uid,
            email: currentUser.email,
            displayName: currentUser.displayName,
            photoURL: currentUser.photoURL,
            role: 'user',
            createdAt: Date.now(),
            status: 'active'
          };
          await db.collection('users').doc(uid).set(userData, { merge: true });
        }
        // Check admin UID collection
        const adminDoc = await db.collection('adminUids').doc(uid).get();
        if (adminDoc.exists || userData.role === 'admin') {
          userData.role = 'admin';
          await db.collection('users').doc(uid).set({ role: 'admin' }, { merge: true });
        }
        await loadFavorites();
      } catch (e) {
        console.error('Error fetching user data:', e);
        // Fallback: set minimal userData so app doesn't crash
        userData = {
          uid,
          email: currentUser.email,
          displayName: currentUser.displayName,
          photoURL: currentUser.photoURL,
          role: 'user',
          status: 'active'
        };
      }
    }

    async function signInWithGoogle() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        closeModal('auth-modal');
      } catch (e) {
        alert('Sign in failed: ' + e.message);
      }
    }

    function signOutUser() {
      auth.signOut();
    }

    function updateUI() {
      // Nav links
      let navHtml = `
        <a href="#home">Home</a>
        <a href="#beats">Beats</a>
        <a href="#producers">Producers</a>
        <a href="#licenses">Licenses</a>
      `;
      if (currentUser) {
        navHtml += `<a href="#library">Library</a>`;
        navHtml += `<a href="#search">Search</a>`;
        if (userData && userData.role === 'admin') {
          navHtml += `<a href="#admin">Admin</a>`;
        }
        if (userData && (userData.role === 'artist' || userData.role === 'admin')) {
          navHtml += `<a href="#upload-music">Upload Music</a>`;
        }
        if (userData && (userData.role === 'producer' || userData.role === 'admin')) {
          navHtml += `<a href="#producer-upload">Upload Beat</a>`;
        }
      }
      navLinks.innerHTML = navHtml;

      // Auth area
      if (currentUser) {
        authArea.innerHTML = `
          <img src="${currentUser.photoURL || 'https://picsum.photos/36/36?random=1'}" alt="avatar" title="${currentUser.displayName}" onclick="showUserMenu()">
          <button class="btn" onclick="signOutUser()">Sign Out</button>
        `;
      } else {
        authArea.innerHTML = `<button class="btn" onclick="openModal('auth-modal')">Sign In</button>`;
      }

      // Sidebar
      renderSidebar();
    }

    function renderSidebar() {
      let html = '';
      if (!currentUser) {
        html = `<p>Please sign in to see dashboard.</p>`;
      } else {
        // IMPORTANT: Ensure userData is not null before accessing properties
        const role = userData ? userData.role : 'user';
        if (role === 'admin') {
          html = `
            <h3>Admin</h3>
            <a href="#admin/dashboard">Dashboard</a>
            <a href="#admin/users">Users</a>
            <a href="#admin/beats">Beats</a>
            <a href="#admin/music">Music</a>
            <a href="#admin/sales">Sales</a>
            <a href="#admin/revenue">Revenue</a>
            <a href="#admin/moderation">Moderation</a>
            <a href="#admin/analytics">Analytics</a>
            <a href="#admin/storage">Storage</a>
            <a href="#admin/notifications">Notifications</a>
            <a href="#admin/settings">Settings</a>
            <a href="#admin/admins">Admin Mgmt</a>
            <a href="#admin/logs">System Logs</a>
          `;
        }
        if (role === 'producer' || role === 'admin') {
          html += `
            <h3>Producer</h3>
            <a href="#producer-upload">Upload Beat</a>
            <a href="#my-beats">My Beats</a>
            <a href="#sales">Sales</a>
            <a href="#customers">Customers</a>
            <a href="#earnings">Earnings</a>
          `;
        }
        if (role === 'artist' || role === 'admin') {
          html += `
            <h3>Artist</h3>
            <a href="#upload-music">Upload Music</a>
            <a href="#albums">Albums</a>
            <a href="#singles">Singles</a>
            <a href="#distribution">Distribution</a>
            <a href="#analytics">Analytics</a>
          `;
        }
        html += `
          <h3>General</h3>
          <a href="#library">Favorites</a>
          <a href="#purchases">Purchases</a>
        `;
      }
      sidebar.innerHTML = html;
    }

    function showUserMenu() {
      // For now just show sign out button already in auth area.
    }

    // ================== FAVORITES ==================
    async function loadFavorites() {
      if (!currentUser) return;
      try {
        const snapshot = await db.collection('favorites').where('userId', '==', currentUser.uid).get();
        favorites = new Set(snapshot.docs.map(d => d.data().beatId));
      } catch (e) {
        console.error(e);
      }
    }

    async function toggleFavorite(beatId) {
      if (!currentUser) {
        alert('Please sign in first.');
        return;
      }
      const docId = `${currentUser.uid}_${beatId}`;
      if (favorites.has(beatId)) {
        await db.collection('favorites').doc(docId).delete();
        favorites.delete(beatId);
      } else {
        await db.collection('favorites').doc(docId).set({
          userId: currentUser.uid,
          beatId: beatId,
          createdAt: Date.now()
        });
        favorites.add(beatId);
      }
      handleRoute(); // re-render current page
    }

    // ================== FIRESTORE HELPERS ==================
    async function fetchBeats(status = 'published') {
      try {
        let query = db.collection('beats');
        if (status) query = query.where('status', '==', status);
        const snapshot = await query.orderBy('createdAt', 'desc').get();
        allBeats = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        console.error('Error fetching beats:', e);
        allBeats = [];
      }
    }

    async function fetchMusic(status = 'published') {
      try {
        let query = db.collection('music');
        if (status) query = query.where('status', '==', status);
        const snapshot = await query.orderBy('createdAt', 'desc').get();
        allMusic = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        console.error('Error fetching music:', e);
        allMusic = [];
      }
    }

    async function incrementBeatPlays(beatId) {
      try {
        await db.collection('beats').doc(beatId).update({
          plays: firebase.firestore.FieldValue.increment(1)
        });
      } catch (e) {}
    }

    async function incrementBeatDownloads(beatId) {
      try {
        await db.collection('beats').doc(beatId).update({
          downloads: firebase.firestore.FieldValue.increment(1)
        });
      } catch (e) {}
    }

    // ================== SUPABASE UPLOAD ==================
    async function uploadFile(bucket, path, file) {
      const { data, error } = await supabase.storage.from(bucket).upload(path, file, {
        cacheControl: '3600',
        upsert: false
      });
      if (error) throw error;
      const { data: publicData } = supabase.storage.from(bucket).getPublicUrl(path);
      return publicData.publicUrl;
    }

    async function uploadBeatPreview(file) {
      const path = `previews/${Date.now()}_${file.name}`;
      return await uploadFile('beats', path, file);
    }

    async function uploadCoverArt(file) {
      const path = `covers/${Date.now()}_${file.name}`;
      return await uploadFile('covers', path, file);
    }

    async function uploadMusicAudio(file) {
      const path = `music/${Date.now()}_${file.name}`;
      return await uploadFile('music', path, file);
    }

    // ================== ROUTER ==================
    window.addEventListener('hashchange', handleRoute);

    function handleRoute() {
      const hash = location.hash.slice(1) || 'home';
      const parts = hash.split('/');
      currentRoute = parts[0];
      if (currentRoute === 'beat') currentBeatId = parts[1];
      if (currentRoute === 'artist') currentArtistId = parts[1];
      if (currentRoute === 'admin') adminSection = parts[1] || 'dashboard';
      renderCurrentPage();
    }

    function renderCurrentPage() {
      if (!currentUser) {
        renderHome();
        return;
      }
      switch (currentRoute) {
        case 'home': renderHome(); break;
        case 'beats': renderBeats(); break;
        case 'beat': renderBeatDetails(currentBeatId); break;
        case 'producers': renderProducers(); break;
        case 'licenses': renderLicenses(); break;
        case 'purchases': renderPurchases(); break;
        case 'artists': renderArtists(); break;
        case 'artist': renderArtistProfile(currentArtistId); break;
        case 'upload-music': if (userData && (userData.role === 'artist' || userData.role === 'admin')) renderUploadMusic(); else renderHome(); break;
        case 'albums': renderAlbums(); break;
        case 'singles': renderSingles(); break;
        case 'distribution': renderDistribution(); break;
        case 'analytics': renderAnalytics(); break;
        case 'producer-upload': if (userData && (userData.role === 'producer' || userData.role === 'admin')) renderProducerUpload(); else renderHome(); break;
        case 'my-beats': renderMyBeats(); break;
        case 'sales': renderSales(); break;
        case 'customers': renderCustomers(); break;
        case 'earnings': renderEarnings(); break;
        case 'library': renderLibrary(); break;
        case 'search': renderSearch(); break;
        case 'admin': if (userData && userData.role === 'admin') renderAdmin(); else renderHome(); break;
        default: renderHome();
      }
    }

    // ================== BEAT CARD ==================
    function beatCard(beat, showFavorite = true) {
      const isFav = favorites.has(beat.id);
      const cover = beat.coverArtUrl || `https://picsum.photos/300/300?random=${beat.id}`;
      return `
        <div class="beat-card glass">
          <img src="${cover}" alt="cover">
          <div class="beat-info">
            <h3>${truncate(beat.title, 40)}</h3>
            <p>Producer: ${beat.producerName || 'Unknown'}</p>
            <p>${beat.bpm || '--'} BPM | ${beat.key || '--'} | ${beat.genre || 'Unknown'}</p>
            <p>$${beat.price || 0}</p>
            <div>
              <button class="btn" onclick="playBeat('${beat.id}')">▶ Play</button>
              ${showFavorite ? `<button class="btn" onclick="toggleFavorite('${beat.id}')">${isFav ? '❤️' : '🤍'}</button>` : ''}
              <a class="btn" href="#beat/${beat.id}">Details</a>
            </div>
          </div>
        </div>
      `;
    }

    function musicCard(music) {
      const cover = music.coverArtUrl || `https://picsum.photos/300/300?random=${music.id}`;
      return `
        <div class="card glass">
          <img src="${cover}" alt="cover" style="height: 150px; width: 100%; object-fit: cover;">
          <h3>${truncate(music.title, 30)}</h3>
          <p>${music.artistName || 'Unknown'}</p>
          <p>${music.genre || 'Unknown'} | ${formatDate(music.releaseDate)}</p>
          <button class="btn" onclick="playMusic('${music.id}')">▶ Play</button>
        </div>
      `;
    }

    // ================== PLAYER ==================
    function playBeat(id) {
      const beat = allBeats.find(b => b.id === id);
      if (!beat) return;
      playerQueue = allBeats.filter(b => b.previewUrl);
      playerIndex = playerQueue.findIndex(b => b.id === id);
      if (playerIndex === -1) {
        playerQueue = [beat];
        playerIndex = 0;
      }
      playCurrentTrack();
      incrementBeatPlays(id);
    }

    function playMusic(id) {
      const music = allMusic.find(m => m.id === id);
      if (!music) return;
      playerQueue = allMusic.filter(m => m.audioUrl);
      playerIndex = playerQueue.findIndex(m => m.id === id);
      if (playerIndex === -1) {
        playerQueue = [music];
        playerIndex = 0;
      }
      playCurrentTrack();
    }

    function playCurrentTrack() {
      if (!playerQueue.length || playerIndex < 0 || playerIndex >= playerQueue.length) return;
      const track = playerQueue[playerIndex];
      const url = track.previewUrl || track.audioUrl;
      if (!url) return;
      audioPlayer.src = url;
      audioPlayer.play();
      playerInfo.textContent = track.title || 'Now playing';
    }

    function playNext() {
      if (playerQueue.length === 0) return;
      playerIndex = (playerIndex + 1) % playerQueue.length;
      playCurrentTrack();
    }

    function playPrev() {
      if (playerQueue.length === 0) return;
      playerIndex = (playerIndex - 1 + playerQueue.length) % playerQueue.length;
      playCurrentTrack();
    }

    async function renderCustomers() {

    async function renderEarnings() {
      if (!currentUser) return;
      mainContent.innerHTML = '<div class="glass"><h2>Loading...</h2></div>';
      try {
        const beatSnapshot = await db.collection('beats').where('producerUid', '==', currentUser.uid).get();
        const beatIds = beatSnapshot.docs.map(d => d.id);
        if (beatIds.length === 0) {
          mainContent.innerHTML = '<div class="glass"><h2>Earnings</h2><p>No earnings yet</p></div>';
          return;
        }
        const purchasesSnapshot = await db.collection('purchases').where('beatId', 'in', beatIds).where('status', '==', 'completed').get();
        const purchases = purchasesSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        const totalEarnings = purchases.reduce((sum, p) => sum + (p.price || 0), 0);
        const platformFee = totalEarnings * 0.2; // 20% commission
        const netEarnings = totalEarnings - platformFee;
        mainContent.innerHTML = `
          <div class="glass">
            <h2>Earnings</h2>
            <div class="grid">
              <div class="card"><strong>Gross Earnings:</strong> $${totalEarnings}</div>
              <div class="card"><strong>Platform Fee:</strong> $${platformFee}</div>
              <div class="card"><strong>Net Earnings:</strong> $${netEarnings}</div>
            </div>
            <button class="btn" onclick="alert('Withdrawal requested!')">Withdraw Earnings</button>
          </div>
        `;
      } catch (e) {
        console.error(e);
      }
    }

    async function handleGlobalSearch(query) {
      const results = document.getElementById('search-results');
      if (!query.trim()) {
        results.innerHTML = '<p>Type to search...</p>';
        return;
      }
      await fetchBeats();
      await fetchMusic();
      const q = query.toLowerCase();
      const beatResults = allBeats.filter(b => b.title.toLowerCase().includes(q) || (b.tags || []).some(t => t.toLowerCase().includes(q)));
      const musicResults = allMusic.filter(m => m.title.toLowerCase().includes(q) || m.artistName.toLowerCase().includes(q));
      results.innerHTML = `
        <h3>Beats</h3>
        <div class="grid">${beatResults.map(b => beatCard(b)).join('') || '<p>No beats found</p>'}</div>
        <h3>Music</h3>
        <div class="grid">${musicResults.map(m => musicCard(m)).join('') || '<p>No music found</p>'}</div>
      `;
    }

    function renderUserTable(users) {
      return `
        <table>
          <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
          ${users.map(u => `
            <tr>
              <td>${u.displayName || 'Unknown'}</td>
              <td>${u.email}</td>
              <td>${u.role || 'user'}</td>
              <td>${u.status || 'active'}</td>
              <td>
                <button class="btn" onclick="adminUpdateUserStatus('${u.uid}', 'suspended')">Suspend</button>
                <button class="btn" onclick="adminUpdateUserStatus('${u.uid}', 'banned')">Ban</button>
                <button class="btn" onclick="adminUpdateUserStatus('${u.uid}', 'active')">Activate</button>
              </td>
            </tr>
          `).join('') || '<tr><td colspan="5">No users</td></tr>'}
        </table>
      `;
    }

    async function filterAdminUsers(filter) {
      const snapshot = await db.collection('users').get();
      let users = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      if (filter === 'all') users = users;
      else if (filter === 'suspended') users = users.filter(u => u.status === 'suspended');
      else if (filter === 'banned') users = users.filter(u => u.status === 'banned');
      else users = users.filter(u => u.role === filter);
      document.getElementById('admin-users-list').innerHTML = renderUserTable(users);
    }

    async function adminUpdateUserStatus(uid, status) {
      await db.collection('users').doc(uid).update({ status });
      filterAdminUsers('all');
    }
